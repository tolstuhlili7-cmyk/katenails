<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KATENAILS Admin</title><style>body{font:16px Arial;background:#f7faef;padding:20px}.row{background:white;padding:15px;margin:10px 0;border-radius:15px}button,input{padding:10px;margin:4px}</style><h1>KATENAILS — записи</h1><input id="key" type="password" placeholder="Ключ"><button onclick="load()">Войти</button><div id="list"></div><script>async function load(){let r=await fetch("/api/bookings",{headers:{"x-admin-key":key.value}}),a=await r.json();list.innerHTML=r.ok?a.map(x=>`<div class=row><b>${x.date} ${x.time}</b> — ${x.service}<br>${x.name} · ${x.phone}<br>${x.comment||""}<br>${x.status}<br><button onclick="act(${x.id},'confirmed')">Подтвердить</button><button onclick="act(${x.id},'cancelled')">Отменить</button></div>`).join(""):a.error}async function act(id,status){await fetch("/api/bookings/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-key":key.value},body:JSON.stringify({status})});load()}</script>
