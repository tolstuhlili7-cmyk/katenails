<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KATENAILS — Адмін</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f7faef;
  padding:20px;
  margin:0;
  color:#222;
}

h1,h2{margin-top:0}

.card,.row{
  background:white;
  padding:16px;
  margin:15px 0;
  border-radius:16px;
}

input,select,textarea,button{
  box-sizing:border-box;
  width:100%;
  padding:12px;
  margin:5px 0;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  cursor:pointer;
  background:#c9ef91;
  border:0;
}

.danger{
  background:#ffd5d5;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  flex:1;
}

.status{
  margin-top:8px;
  font-weight:bold;
}

#message{
  font-weight:bold;
  margin:15px 0;
}
</style>
</head>

<body>

<h1>KATENAILS — Адмін-панель</h1>

<div class="card" id="loginBox">
  <input id="key" type="password" placeholder="Ключ адміністратора">
  <button onclick="login()">Увійти</button>
</div>

<div id="message"></div>

<div id="admin" style="display:none">

<!-- ДОДАТИ ЗАПИС -->

<div class="card">
<h2>➕ Додати запис вручну</h2>

<select id="manualService">
<option>Манікюр</option>
<option>Стрижки</option>
</select>

<input id="manualDate" type="date">

<select id="manualTime">
<option value="">Оберіть час</option>
</select>

<input id="manualName" placeholder="Ім'я клієнта">

<input id="manualPhone" placeholder="Телефон" type="tel">

<input id="manualInstagram" placeholder="Instagram, наприклад @username">

<textarea id="manualComment" placeholder="Коментар"></textarea>

<button onclick="addBooking()">Додати запис</button>
</div>


<!-- ЗАКРИТИ ДЕНЬ -->

<div class="card">
<h2>🚫 Закрити день</h2>

<input id="closedDayDate" type="date">

<button onclick="closeDay()">Закрити цей день</button>

<div id="closedDays"></div>
</div>


<!-- ЗАКРИТИ ЧАС -->

<div class="card">
<h2>🕐 Закрити окремий час</h2>

<input id="closedSlotDate" type="date">

<select id="closedSlotTime"></select>

<button onclick="closeSlot()">Закрити цей час</button>

<div id="closedSlots"></div>
</div>


<!-- ЗАПИСИ -->

<h2>📋 Записи</h2>

<div id="list"></div>

</div>


<script>

let adminKey="";

const slots=[
"09:00","10:00","11:00","12:00",
"13:00","14:00","15:00","16:00",
"17:00"
];

const $=id=>document.getElementById(id);


/* ЗАПАМ'ЯТАТИ АДМІНА */

const savedKey=localStorage.getItem("katenails_admin_key");

if(savedKey){
  adminKey=savedKey;
  login(true);
}


/* ВХІД */

async function login(auto=false){

  if(!auto){
    adminKey=$("key").value.trim();
  }

  if(!adminKey){
    message("Введіть ключ адміністратора");
    return;
  }

  const r=await fetch("/api/bookings",{
    headers:{
      "x-admin-key":adminKey
    }
  });

  const data=await r.json();

  if(!r.ok){
    if(auto){
      localStorage.removeItem("katenails_admin_key");
      adminKey="";
      return;
    }

    message(data.error||"Помилка входу");
    return;
  }

  localStorage.setItem(
    "katenails_admin_key",
    adminKey
  );

  $("loginBox").style.display="none";
  $("admin").style.display="block";

  message("");

  await loadAll();
}


/* ВСІ ДАНІ */

async function loadAll(){

  await loadBookings();
  await loadClosedDays();
  await loadClosedSlots();
  await updateManualTimes();

}


/* ЗАПИСИ */

async function loadBookings(){

  const r=await fetch("/api/bookings",{
    headers:{
      "x-admin-key":adminKey
    }
  });

  const data=await r.json();

  if(!r.ok){
    message(data.error||"Помилка");
    return;
  }

  if(!data.length){
    $("list").innerHTML="<p>Записів поки немає.</p>";
    return;
  }

  $("list").innerHTML=data.map(x=>`

    <div class="row">

      <b>${x.date} ${x.time}</b><br>

      Послуга: ${esc(x.service)}<br>
      Клієнт: ${esc(x.name)}<br>
      Телефон: ${esc(x.phone)}<br>
      Instagram: ${esc(x.instagram||"—")}<br>
      Коментар: ${esc(x.comment||"—")}

      <div class="status">
        ${statusText(x.status)}
      </div>

      ${
        x.status==="pending"
        ? `
        <div class="actions">

          <button onclick="changeStatus(${x.id},'confirmed')">
            ✅ Підтвердити
          </button>

          <button class="danger"
            onclick="changeStatus(${x.id},'cancelled')">
            ❌ Скасувати
          </button>

        </div>
        `
        :""
      }

    </div>

  `).join("");

}


/* ПІДТВЕРДИТИ / СКАСУВАТИ */

async function changeStatus(id,status){

  const r=await fetch(
    "/api/bookings/"+id,
    {
      method:"PATCH",
      headers:{
        "Content-Type":"application/json",
        "x-admin-key":adminKey
      },
      body:JSON.stringify({status})
    }
  );

  const data=await r.json();

  if(!r.ok){
    message(data.error||"Не вдалося змінити статус");
    return;
  }

  await loadBookings();

}


/* РУЧНИЙ ЗАПИС */

async function addBooking(){

  const body={
    service:$("manualService").value,
    date:$("manualDate").value,
    time:$("manualTime").value,
    name:$("manualName").value.trim(),
    phone:$("manualPhone").value.trim(),
    instagram:$("manualInstagram").value.trim(),
    comment:$("manualComment").value.trim()
  };

  if(
    !body.date||
    !body.time||
    !body.name||
    !body.phone||
    !body.instagram
  ){

    message(
      "Заповніть дату, час, ім'я, телефон та Instagram"
    );

    return;
  }

  const r=await fetch(
    "/api/admin/bookings",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-admin-key":adminKey
      },
      body:JSON.stringify(body)
    }
  );

  const data=await r.json();

  if(!r.ok){
    message(data.error||"Не вдалося додати запис");
    return;
  }

  message("Запис успішно додано ✅");

  $("manualName").value="";
  $("manualPhone").value="";
  $("manualInstagram").value="";
  $("manualComment").value="";

  await loadAll();

}


/* ВІЛЬНИЙ ЧАС ДЛЯ РУЧНОГО ЗАПИСУ */

async function updateManualTimes(){

  const date=$("manualDate").value;
  const service=$("manualService").value;

  if(!date)return;

  const r=await fetch(
    `/api/availability?service=${encodeURIComponent(service)}&date=${date}`
  );

  const data=await r.json();

  $("manualTime").innerHTML=
    '<option value="">Оберіть час</option>';

  data.slots
    .filter(x=>x.available)
    .forEach(x=>{

      const o=document.createElement("option");

      o.value=x.time;
      o.textContent=x.time;

      $("manualTime").appendChild(o);

    });

}


/* ЗАКРИТИ ДЕНЬ */

async function closeDay(){

  const date=$("closedDayDate").value;

  if(!date){
    message("Оберіть дату");
    return;
  }

  const r=await fetch(
    "/api/admin/closed-days",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-admin-key":adminKey
      },
      body:JSON.stringify({date})
    }
  );

  const data=await r.json();

  if(!r.ok){
    message(data.error||"Помилка");
    return;
  }

  message("День закрито 🚫");

  await loadAll();

}


/* СПИСОК ЗАКРИТИХ ДНІВ */

async function loadClosedDays(){

  const r=await fetch(
    "/api/admin/closed-days",
    {
      headers:{
        "x-admin-key":adminKey
      }
    }
  );

  const data=await r.json();

  $("closedDays").innerHTML=data.length
    ? data.map(x=>`
      <div class="row">
        ${x.date}
        <button class="danger"
          onclick="openDay('${x.date}')">
          Відкрити день
        </button>
      </div>
    `).join("")
    : "<p>Закритих днів немає.</p>";

}


/* ВІДКРИТИ ДЕНЬ */

async function openDay(date){

  await fetch(
    "/api/admin/closed-days/"+date,
    {
      method:"DELETE",
      headers:{
        "x-admin-key":adminKey
      }
    }
  );

  await loadAll();

}


/* ЗАКРИТИ ЧАС */

async function closeSlot(){

  const date=$("closedSlotDate").value;
  const time=$("closedSlotTime").value;

  if(!date||!time){
    message("Оберіть дату та час");
    return;
  }

  const r=await fetch(
    "/api/admin/closed-slots",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-admin-key":adminKey
      },
      body:JSON.stringify({
        date,
        time
      })
    }
  );

  const data=await r.json();

  if(!r.ok){
    message(data.error||"Помилка");
    return;
  }

  message("Час закрито 🕐");

  await loadAll();

}


/* СПИСОК ЗАКРИТИХ ГОДИН */

async function loadClosedSlots(){

  const r=await fetch(
    "/api/admin/closed-slots",
    {
      headers:{
        "x-admin-key":adminKey
      }
    }
  );

  const data=await r.json();

  $("closedSlots").innerHTML=data.length
    ? data.map(x=>`
      <div class="row">
        ${x.date} — ${x.time}

        <button class="danger"
          onclick="openSlot('${x.date}','${x.time}')">
          Відкрити час
        </button>

      </div>
    `).join("")
    : "<p>Закритих годин немає.</p>";

}


/* ВІДКРИТИ ЧАС */

async function openSlot(date,time){

  await fetch(
    `/api/admin/closed-slots/${date}/${encodeURIComponent(time)}`,
    {
      method:"DELETE",
      headers:{
        "x-admin-key":adminKey
      }
    }
  );

  await loadAll();

}


/* СПИСОК ЧАСУ */

$("closedSlotTime").innerHTML=
  '<option value="">Оберіть час</option>'+
  slots.map(x=>`
    <option value="${x}">${x}</option>
  `).join("");


/* ДАТИ */

const today=
  new Date().toISOString().slice(0,10);

$("manualDate").value=today;
$("closedDayDate").value=today;
$("closedSlotDate").value=today;


/* ПОДІЇ */

$("manualDate").onchange=
  updateManualTimes;

$("manualService").onchange=
  updateManualTimes;


/* СТАТУС */

function statusText(status){

  if(status==="pending")
    return "⏳ Очікує підтвердження";

  if(status==="confirmed")
    return "✅ Підтверджено";

  if(status==="cancelled")
    return "❌ Скасовано";

  return status;
}


/* ПОВІДОМЛЕННЯ */

function message(text){

  $("message").textContent=text;

}


/* БЕЗПЕЧНИЙ ТЕКСТ */

function esc(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
