<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c9ef91">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<title>KATENAILS</title>
</head>

<body>

<header><b>KATENAILS</b> 🌿</header>

<main>

<section class="hero">
<small>BEAUTY STUDIO · БІЛА ЦЕРКВА</small>
<h1>Красота, о которой<br><i>хочется заботиться.</i></h1>
<p>Онлайн-запись</p>
</section>

<section class="card">

<h2>Записаться</h2>

<label>
Услуга
<select id="service">
<option>Маникюр</option>
<option>Стрижки</option>
</select>
</label>

<label>
Дата
<input id="date" type="date">
</label>

<p>Свободное время</p>
<div id="times"></div>

<label>
Имя
<input id="name" placeholder="Ваше имя">
</label>

<label>
Телефон
<input id="phone" placeholder="+380..." type="tel">
</label>

<label>
Instagram
<input id="instagram" placeholder="@username">
</label>

<label>
Комментарий
<textarea id="comment" placeholder="По желанию"></textarea>
</label>

<button id="send">Отправить заявку</button>

<p id="msg"></p>

</section>

<section class="info">
📍 м. Біла Церква, вул. Водопійна, 25<br>
📞 +380 68 518 56 02
</section>

</main>

<script src="/app.js"></script>

</body>
</html>
